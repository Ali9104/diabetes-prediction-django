{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OsteoPredict - Connexion</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1117; --surface: #1a1d27; --border: #2d3248;
            --text: #e8eaf0; --text-muted: #7c82a0; --accent: #4f9eff;
            --font-display: 'DM Serif Display', serif; --font-body: 'DM Sans', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-body); background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .login-container { width: 100%; max-width: 420px; padding: 2rem; }
        .logo { text-align: center; margin-bottom: 2.5rem; }
        .logo h1 { font-family: var(--font-display); font-size: 2.5rem; }
        .logo h1 span { color: var(--accent); }
        .logo p { color: var(--text-muted); margin-top: 8px; font-size: 0.9rem; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--text-muted); margin-bottom: 8px; }
        input {
            width: 100%; background: var(--bg); border: 1px solid var(--border);
            border-radius: 10px; padding: 12px 16px; color: var(--text);
            font-family: var(--font-body); font-size: 0.95rem; transition: border-color .2s;
        }
        input:focus { outline: none; border-color: var(--accent); }
        button {
            width: 100%; background: var(--accent); color: #fff; border: none;
            border-radius: 10px; padding: 13px; font-family: var(--font-body);
            font-size: 1rem; font-weight: 600; cursor: pointer; transition: background .2s;
        }
        button:hover { background: #3b8fe6; }
        .error { background: #f8717122; color: #f87171; border: 1px solid #f8717144; border-radius: 8px; padding: 10px 14px; margin-bottom: 1rem; font-size: 0.875rem; }
        .divider { text-align: center; color: var(--text-muted); font-size: 0.8rem; margin: 1.5rem 0; }
    </style>
</head>
<body>
<div class="login-container">
    <div class="logo">
        <h1>Osteo<span>Predict</span></h1>
        <p>Système de détection de l'ostéoporose par IA</p>
    </div>
    <div class="card">
        {% if form.errors %}
        <div class="error">Identifiant ou mot de passe incorrect.</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Identifiant</label>
                <input type="text" name="username" id="id_username" placeholder="Votre identifiant" autofocus required>
            </div>
            <div class="form-group">
                <label for="id_password">Mot de passe</label>
                <input type="password" name="password" id="id_password" placeholder="Votre mot de passe" required>
            </div>
            <button type="submit">Se connecter</button>
        </form>
        <div class="divider">Portail sécurisé pour les professionnels de santé</div>
    </div>
</div>
</body>
</html>
